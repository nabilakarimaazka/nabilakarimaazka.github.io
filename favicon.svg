<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Browser-tab icon: bar chart with an upward trend line (data science) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- bars -->
  <rect x="12" y="38" width="8" height="14" rx="2.5" fill="#ffffff" opacity=".55"/>
  <rect x="24" y="30" width="8" height="22" rx="2.5" fill="#ffffff" opacity=".7"/>
  <rect x="36" y="34" width="8" height="18" rx="2.5" fill="#ffffff" opacity=".55"/>
  <rect x="48" y="22" width="8" height="30" rx="2.5" fill="#ffffff" opacity=".85"/>
  <!-- trend line -->
  <path d="M16 30 L28 20 L40 25 L52 12" fill="none" stroke="#67e8f9" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="30" r="3.2" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="28" cy="20" r="3.2" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="40" cy="25" r="3.2" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="52" cy="12" r="3.2" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
</svg>
