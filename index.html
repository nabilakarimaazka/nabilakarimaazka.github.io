<title>Portfolio</title>
<meta name="description" content="Data Scientist portfolio — machine learning, analytics and data products. Open to remote roles worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Load data.js fresh on every visit so updates show up right away (GitHub Pages caches files for 10 minutes) -->
<script>document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');</script>
<script>document.documentElement.dataset.palette = (window.PORTFOLIO && window.PORTFOLIO.theme) || "blue";</script>
<style>
  /* Color themes: set `theme` in data.js to blue, coral, pink or brown */
  :root { --radius: 22px; --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent); }
  :root { --bg: #ffffff; --surface: #f8f8fa; --surface-2: #f0f0f4; --text: #18181b; --muted: #63636e; --border: #ececf1;
          --accent: #db2777; --accent-2: #7c3aed; --on-accent: #ffffff; --good: #16a34a;
          --hero-a: #fde7ef; --hero-b: #f3f0fa; --shadow: 0 1px 2px rgba(24,24,27,.04), 0 12px 32px rgba(24,24,27,.07); }
  :root[data-palette="blue"]  { --surface: #f8fafc; --surface-2: #f1f5f9; --border: #e2e8f0; --text: #0f172a; --muted: #475569;
                                --accent: #1d4ed8; --accent-2: #0e7490; --hero-a: #e7eefc; --hero-b: #f1f5f9;
                                --shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px rgba(15,23,42,.08); }
  :root[data-palette="coral"] { --accent: #f2654f; --accent-2: #6d5bb5; --hero-a: #fde8e3; --hero-b: #f1eff6; }
  :root[data-palette="brown"] { --bg: #fffdfa; --surface: #faf6f1; --surface-2: #f3ebe1; --border: #ede3d7; --text: #2b1d14; --muted: #6f5e50;
                                --accent: #9a5b2e; --accent-2: #c8874a; --hero-a: #f6e8da; --hero-b: #f7f2ec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0d0d10; --surface: #16161b; --surface-2: #1f1f26; --text: #f4f4f6; --muted: #a1a1ad; --border: #26262e;
    --on-accent: #ffffff; --good: #4ade80; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --hero-a: color-mix(in srgb, var(--accent) 16%, #16161b); --hero-b: #16161b; } }
  :root[data-theme="dark"] {
    --bg: #0d0d10; --surface: #16161b; --surface-2: #1f1f26; --text: #f4f4f6; --muted: #a1a1ad; --border: #26262e;
    --on-accent: #ffffff; --good: #4ade80; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --hero-a: color-mix(in srgb, var(--accent) 16%, #16161b); --hero-b: #16161b; }
  @media (prefers-color-scheme: dark) { :root[data-palette="blue"]:not([data-theme="light"]) {
    --bg: #0b1120; --surface: #111a2e; --surface-2: #17223a; --border: #1f2a40; --text: #f1f5f9; --muted: #94a3b8;
    --accent: #60a5fa; --accent-2: #22d3ee; --on-accent: #0b1120; --hero-a: #13254a; --hero-b: #111a2e; } }
  :root[data-palette="blue"][data-theme="dark"] {
    --bg: #0b1120; --surface: #111a2e; --surface-2: #17223a; --border: #1f2a40; --text: #f1f5f9; --muted: #94a3b8;
    --accent: #60a5fa; --accent-2: #22d3ee; --on-accent: #0b1120; --hero-a: #13254a; --hero-b: #111a2e; }
  @media (prefers-color-scheme: dark) { :root[data-palette="coral"]:not([data-theme="light"]) { --accent: #ff7a63; --accent-2: #a594e8; } }
  :root[data-palette="coral"][data-theme="dark"] { --accent: #ff7a63; --accent-2: #a594e8; }
  @media (prefers-color-scheme: dark) { :root[data-palette="pink"]:not([data-theme="light"]) { --accent: #f472b6; --accent-2: #a78bfa; } }
  :root[data-palette="pink"][data-theme="dark"] { --accent: #f472b6; --accent-2: #a78bfa; }
  @media (prefers-color-scheme: dark) { :root[data-palette="brown"]:not([data-theme="light"]) { --accent: #e0a46b; --accent-2: #f0c98f; --on-accent: #21160e; } }
  :root[data-palette="brown"][data-theme="dark"] { --accent: #e0a46b; --accent-2: #f0c98f; --on-accent: #21160e; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4, .display { font-family: Poppins, Inter, sans-serif; letter-spacing: -.02em; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  [hidden] { display: none !important; }

  /* ---------- Nav ---------- */
  nav { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); }
  nav .wrap { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 17px; white-space: nowrap; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none;
                background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
  .nav-links { display: flex; gap: 26px; font-size: 15px; color: var(--muted); font-weight: 500; }
  .nav-links a { transition: color .15s; }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }
  .nav-right { display: flex; gap: 8px; align-items: center; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
              display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 18px; height: 18px; }
  .lang { display: inline-flex; height: 38px; padding: 3px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
  .lang button { border: 0; background: transparent; color: var(--muted); font: 600 12.5px Inter, sans-serif; padding: 0 10px; border-radius: 7px; cursor: pointer; }
  .lang button.on { background: var(--accent); color: var(--on-accent); }
  .menu-btn { display: none; }
  .mobile-menu { display: none; }

  /* ---------- Buttons & chips ---------- */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; font-weight: 600; font-size: 14.5px;
         border: 1.5px solid transparent; cursor: pointer; font-family: inherit; transition: transform .15s, background .15s, color .15s; }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-outline { border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); background: transparent; }
  .btn-outline:hover { background: var(--accent-soft); }
  .btn-sm { padding: 7px 14px; font-size: 13.5px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px;
          background: var(--bg); border: 1px solid var(--border); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .chip:nth-child(3n+2) i { background: var(--accent-2); }
  .chip:nth-child(3n) i { background: var(--good); }

  /* ---------- Hero bento ---------- */
  .hero { padding: 44px 0 24px; }
  .bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .hero-main { grid-column: span 2; padding: 40px 40px 36px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b) 70%); }
  .hero-main h1 { font-size: clamp(44px, 7vw, 76px); line-height: 1.02; font-weight: 800; margin: 12px 0 22px; }
  .hero-main p { color: var(--muted); font-size: 17px; max-width: 560px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 26px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 22%, transparent); }
  .photo-card { overflow: hidden; min-height: 320px; position: relative; display: grid; place-items: center;
                background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 20%, var(--surface)), color-mix(in srgb, var(--accent-2) 20%, var(--surface))); }
  .photo-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
  .photo-initials { font-family: Poppins, sans-serif; font-size: 96px; font-weight: 800; color: color-mix(in srgb, var(--accent) 75%, var(--text)); }
  .photo-caption { position: absolute; left: 14px; bottom: 14px; right: 14px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 1; }
  .photo-caption span { font-size: 12.5px; font-weight: 500; padding: 5px 11px; border-radius: 999px; color: var(--text);
                        background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(6px); }
  .stat { padding: 24px 28px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .stat .v { font-family: Poppins, sans-serif; font-size: clamp(44px, 5.5vw, 64px); font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--accent); }
  .stat.alt .v { color: var(--accent-2); }
  .stat .l { color: var(--muted); font-size: 15px; font-weight: 500; }
  .tech { padding: 24px 26px; }
  .tech.wide { grid-column: span 2; }
  .tech .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

  /* ---------- Sections ---------- */
  section { padding: 88px 0; }
  section.tint { background: linear-gradient(135deg, var(--hero-a), var(--hero-b) 60%, var(--bg)); }
  .sec-head { margin-bottom: 34px; }
  .sec-head h2 { font-size: clamp(30px, 4vw, 40px); font-weight: 700; margin: 6px 0 10px; }
  .sec-head p { color: var(--muted); max-width: 580px; font-size: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .filter { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted);
            font: 500 13.5px Inter, sans-serif; cursor: pointer; }
  .filter.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* ---------- Projects ---------- */
  .projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .pcard { display: flex; flex-direction: column; overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; text-align: left; font: inherit; color: inherit; }
  .pcard:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .pcover { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--surface-2); }
  .pcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pcover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cover-title { position: absolute; left: 24px; top: 20px; right: 24px; color: #fff; font-family: Poppins, sans-serif; z-index: 1; }
  .cover-title b { display: block; font-size: 32px; line-height: 1.15; font-weight: 700; }
  .cover-title span { font-size: 14px; opacity: .85; }
  .cover-cat { position: absolute; left: 14px; top: 14px; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
               background: rgba(255,255,255,.9); color: #0f172a; }
  .pbody { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .phead { display: flex; gap: 12px; align-items: center; }
  .plogo { width: 36px; height: 36px; border-radius: 9px; flex: none; overflow: hidden; display: grid; place-items: center; font: 700 13px Poppins, sans-serif;
           background: var(--accent-soft); color: var(--accent); }
  .plogo img { width: 100%; height: 100%; object-fit: cover; }
  .phead h3 { font-size: 16.5px; font-weight: 600; line-height: 1.3; }
  .phead small { color: var(--muted); font-size: 13px; }
  .pbody .summary { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .pfoot { margin-top: auto; padding-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .metric { font-size: 13px; color: var(--muted); }
  .metric b { font-family: Poppins, sans-serif; color: var(--text); font-size: 15px; margin-right: 4px; }
  .pcard.featured { grid-column: span 2; }
  .pcard.featured .pcover { aspect-ratio: auto; height: 300px; }
  .gh { font-size: 12.5px; color: var(--good); font-weight: 600; }
  .more { margin-top: 28px; }

  /* ---------- Project modal ---------- */
  dialog { border: none; border-radius: 24px; padding: 0; width: min(760px, calc(100% - 32px)); max-height: calc(100vh - 48px);
           background: var(--bg); color: var(--text); box-shadow: 0 30px 80px rgba(0,0,0,.35); margin: auto; }
  dialog::backdrop { background: rgba(10,10,14,.55); backdrop-filter: blur(4px); }
  .mcover { aspect-ratio: 16 / 7; position: relative; background: var(--surface-2); overflow: hidden; }
  .mcover img { width: 100%; height: 100%; object-fit: cover; }
  .mcover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mclose { position: absolute; top: 14px; right: 14px; z-index: 2; background: color-mix(in srgb, var(--bg) 85%, transparent); }
  .mbody { padding: 26px 30px 30px; display: grid; gap: 18px; }
  .mbody h3 { font-size: 26px; line-height: 1.2; }
  .mmeta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .impact { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .impact div { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .impact b { display: block; font-family: Poppins, sans-serif; font-size: 22px; color: var(--accent); line-height: 1.2; }
  .impact span { font-size: 13px; color: var(--muted); }
  .case { display: grid; gap: 14px; }
  .case h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-family: Inter, sans-serif; font-weight: 600; }
  .case p { color: var(--muted); font-size: 15px; }
  .mlinks { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Experience timeline ---------- */
  .timeline { display: grid; gap: 26px; }
  .titem { display: grid; grid-template-columns: 52px 1fr; gap: 22px; position: relative; }
  .titem:not(:last-child)::before { content: ""; position: absolute; left: 25px; top: 56px; bottom: -26px; width: 2px; background: var(--border); }
  .tlogo { width: 52px; height: 52px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow);
           display: grid; place-items: center; position: relative; font: 700 15px Poppins, sans-serif; color: var(--accent); }
  .tlogo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .tlogo::after { content: ""; position: absolute; top: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
  .titem:nth-child(2n) .tlogo::after { background: var(--good); }
  .titem:nth-child(3n) .tlogo::after { background: var(--accent-2); }
  .tcard { padding: 24px 28px; background: color-mix(in srgb, var(--bg) 70%, var(--surface)); }
  .ttop { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .torg { color: var(--accent); font-weight: 600; font-size: 15.5px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
  .tcard h3 { font-size: 22px; font-weight: 600; margin: 16px 0 6px; }
  .twhen { display: flex; gap: 16px; color: var(--muted); font-size: 13.5px; flex-wrap: wrap; }
  .twhen span { display: inline-flex; align-items: center; gap: 6px; }
  .twhen svg { width: 14px; height: 14px; }
  .tcard h5 { font-size: 14px; margin: 16px 0 8px; font-family: Inter, sans-serif; }
  .tcard ul { list-style: none; display: grid; gap: 6px; }
  .tcard li { position: relative; padding-left: 16px; color: var(--muted); font-size: 14.5px; }
  .tcard li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* ---------- Skills & why ---------- */
  .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .skill { padding: 24px; }
  .skill h4 { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  .skill h4 i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-style: normal; background: var(--accent-soft); color: var(--accent); }
  .skill p { color: var(--muted); font-size: 13.5px; margin: 4px 0 14px; }
  .skill .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
  .why .card { padding: 24px; }
  .why h4 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .why p { color: var(--muted); font-size: 14.5px; }

  /* ---------- Certificates ---------- */
  .certs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .cert { display: flex; flex-direction: column; overflow: hidden; transition: transform .2s, box-shadow .2s; }
  .cert:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .cert-img { aspect-ratio: 16 / 10; overflow: hidden; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .cert-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cert-body { padding: 22px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .cert-head { display: flex; gap: 14px; align-items: flex-start; }
  .cert-logo { width: 46px; height: 46px; border-radius: 12px; flex: none; overflow: hidden; display: grid; place-items: center;
               background: var(--accent-soft); color: var(--accent); }
  .cert-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .cert-logo svg { width: 24px; height: 24px; }
  .cert h3 { font-size: 16px; font-weight: 600; line-height: 1.35; }
  .cert-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .cert-id { font-size: 12px; color: var(--muted); }
  .cert-foot { margin-top: auto; padding-top: 4px; }

  /* ---------- Articles ---------- */
  .articles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .acard { overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
  .acard:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .acard .pcover { aspect-ratio: 16 / 9; }
  .acard .pbody h3 { font-size: 16.5px; line-height: 1.35; }
  .acard small { color: var(--muted); font-size: 13px; }

  /* ---------- Contact ---------- */
  .contact { padding: 56px; border-radius: 28px; color: #fff; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center;
             background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #000), color-mix(in srgb, var(--accent-2) 80%, #000)); }
  .contact .eyebrow { color: inherit; opacity: .8; }
  .contact h2 { font-size: clamp(30px, 4vw, 42px); margin: 6px 0 12px; line-height: 1.15; }
  .contact p { opacity: .9; }
  .clinks { display: grid; gap: 10px; }
  .clinks a { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; font-weight: 600;
              background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); }
  .clinks a:hover { background: rgba(255,255,255,.22); }
  .clinks svg { width: 18px; height: 18px; flex: none; }
  .clinks small { margin-left: auto; opacity: .8; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  footer { padding: 40px 0 48px; color: var(--muted); font-size: 13.5px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

  @media (max-width: 1080px) {
    .nav-links { display: none; }
    .menu-btn { display: grid; }
    .mobile-menu { position: fixed; inset: 68px 0 auto 0; z-index: 29; background: var(--bg); border-bottom: 1px solid var(--border); padding: 8px 24px 18px; }

const esc = (v) => String(t(v) ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- Auto cover art (used when a project has no image) ----------
function rng(seed) { return () => (seed = (seed * 9301 + 49297) % 233280) / 233280; }
function coverArt(type, seed) {
  const r = rng(seed * 97 + 13), W = 400, H = 250;
  const stops = [["var(--accent)", "var(--accent-2)"], ["var(--accent-2)", "var(--accent)"],
                 ["var(--accent)", "color-mix(in srgb, var(--accent) 55%, #0b1120)"], ["color-mix(in srgb, var(--accent-2) 70%, #0b1120)", "var(--accent-2)"]][seed % 4];
  let g = `<defs><linearGradient id="bg${seed}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${stops[0]}"/><stop offset="1" stop-color="${stops[1]}"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#bg${seed})"/>`;
  for (let i = 1; i < 5; i++) g += `<line x1="0" x2="${W}" y1="${H / 5 * i}" y2="${H / 5 * i}" stroke="#fff" stroke-opacity=".12" stroke-dasharray="3 6"/>`;
  if (type === "bars") {
    const n = 11, bw = W / n;
    for (let i = 0; i < n; i++) { const h = (.2 + r() * .4) * H; g += `<rect x="${i * bw + 7}" y="${H - h}" width="${bw - 14}" height="${h}" rx="5" fill="#fff" opacity="${.18 + (i % 3) * .1}"/>`; }
  } else if (type === "scatter") {
    for (let i = 0; i < 60; i++) { const c = i % 3, cx = [110, 230, 320][c] + (r() - .5) * 110, cy = [170, 200, 150][c] + (r() - .5) * 80;
      g += `<circle cx="${cx}" cy="${cy}" r="${3 + r() * 4}" fill="#fff" opacity="${.2 + r() * .4}"/>`; }
  } else {
    const n = 24, pts = []; let y = .35;
    for (let i = 0; i < n; i++) { y = Math.min(.6, Math.max(.12, y + (r() - .45) * .14 + Math.sin(i / 2.3) * .04)); pts.push([i / (n - 1) * W, H - y * H]); }
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    g += `<path d="${d} L${W} ${H} L0 ${H} Z" fill="#fff" opacity="${type === "area" ? .28 : .14}"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".75" stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg>`;
}
function cover(p, i, withTitle) {
  if (p.image) return `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`;
  return coverArt(p.chart || "line", i + 1) + (withTitle
    ? `<div class="cover-title"><b>${esc(p.title)}</b><span>${esc(p.category)}</span></div>`

}

const icon = {

// ---------- GitHub integration: latest Release, stars and language ----------
const TOPIC_CATEGORY = { "machine-learning": "Machine Learning", "deep-learning": "Machine Learning", "nlp": "NLP",
  "computer-vision": "Computer Vision", "data-analysis": "Analytics", "analytics": "Analytics", "dashboard": "Analytics",
  "data-visualization": "Analytics", "data-engineering": "Data Engineering", "time-series": "Machine Learning" };
const prettyName = (n) => n.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString(L("locale"), { month: "short", year: "numeric" }) : "";

async function fetchGithub(username, linkedRepos) {
  const KEY = "gh-cache-v1", api = (path) => fetch("https://api.github.com" + path).then(r => r.ok ? r.json() : null);
  const cacheKey = username + "|" + linkedRepos.join(",");
  try { const c = JSON.parse(sessionStorage.getItem(KEY)); if (c && Date.now() - c.t < 3600e3 && c.key === cacheKey) return c.data; } catch (e) {}
  const info = (repo, rel) => ({ name: repo.name, description: repo.description || "", url: repo.html_url, homepage: repo.homepage || "",
    stars: repo.stargazers_count || 0, language: repo.language || "", topics: (repo.topics || []).filter(x => x !== "portfolio"),
    release: rel && { tag: rel.tag_name, date: (rel.published_at || "").slice(0, 10), url: rel.html_url } });
  const data = { repos: {}, auto: [] };
  await Promise.all(linkedRepos.map(async name => {
    const [repo, rel] = await Promise.all([api(`/repos/${name}`), api(`/repos/${name}/releases/latest`)]);
    if (repo) data.repos[name] = info(repo, rel);
  }));
  if (username) {
    const repos = (await api(`/users/${username}/repos?per_page=100&sort=updated`)) || [];
    const tagged = repos.filter(r => (r.topics || []).includes("portfolio") && !r.fork && !r.archived && !data.repos[r.full_name]);
    await Promise.all(tagged.map(async repo => {
      const rel = await api(`/repos/${repo.full_name}/releases/latest`);
      if (rel) { data.repos[repo.full_name] = info(repo, rel); data.auto.push(repo.full_name); }  // only released = final projects
    }));
    data.auto.sort((x, y) => data.repos[y].release.date.localeCompare(data.repos[x].release.date));
  }
  try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), key: cacheKey, data })); } catch (e) {}
  return data;
}
function mergeGithub(projects, gh) {
  const repos = (gh && gh.repos) || {};
  const merged = projects.map(p => {
    const g = p.repo ? repos[p.repo.trim()] : null;
    if (!g) return p;
    return { ...p, gh: g, github: p.github || g.url, demo: p.demo || g.homepage, summary: p.summary || g.description,
      tags: list(p.tags).length ? p.tags : [g.language, ...g.topics].filter(Boolean).slice(0, 6) };
  });
  const charts = ["line", "bars", "scatter", "area"];
  list(gh && gh.auto).forEach((name, i) => {
    const g = repos[name];
    merged.push({ title: prettyName(g.name), category: g.topics.map(x => TOPIC_CATEGORY[x]).find(Boolean) || "Projects",
      chart: charts[i % 4], summary: g.description, tags: [g.language, ...g.topics].filter(Boolean).slice(0, 6),
      releaseDate: g.release.date, github: g.url, demo: g.homepage, gh: g });

}

    if (p.resume) { el.href = p.resume; el.target = "_blank"; el.rel = "noopener"; }
  });
  $("#txtResume").textContent = p.resume ? L("download") : L("onRequest");
  $("#lnkEmail").href = "mailto:" + (p.email || "");
  $("#lnkLinkedin").href = p.linkedin || "#";
  $("#lnkGithub").href = p.github || "#";
  $("#txtLinkedin").textContent = (p.linkedin || "").replace(/^https?:\/\/(www\.)?linkedin\.com/, "");
  $("#txtGithub").textContent = (p.github || "").replace(/^https?:\/\/(www\.)?github\.com\//, "@");

  // 1 stat → tech card stretches across 2 columns; 2 stats → 3 equal cards
  const kpis = list(DATA.heroKpis).slice(0, 2);
  $("#heroStats").innerHTML = kpis.map((k, i) => `
    <div class="card stat reveal in ${i ? "alt" : ""}"><div class="v">${esc(k.value)}</div><div class="l">${esc(k.label)}</div></div>`).join("");
  $("#techCard").classList.toggle("wide", kpis.length === 1);
  $("#techCard").style.gridColumn = kpis.length === 0 ? "1 / -1" : "";
  const tech = list(DATA.techStack).length ? DATA.techStack : list(DATA.skills).flatMap(s => list(s.items).slice(0, 2)).slice(0, 10);
  $("#techChips").innerHTML = list(tech).map(x => `<span class="chip"><i></i>${esc(x)}</span>`).join("");
}

function filtered() { return PROJECTS.map((p, i) => ({ p, i })).filter(({ p }) => currentFilter === "All" || t(p.category) === currentFilter); }

function renderFilters() {
  const cats = ["All", ...new Set(PROJECTS.map(p => t(p.category)).filter(Boolean))];
  if (!cats.includes(currentFilter)) currentFilter = "All";
  $("#filters").innerHTML = cats.length > 2 ? cats.map(c => `<button class="filter ${c === currentFilter ? "active" : ""}" data-c="${esc(c)}">${c === "All" ? L("all") : esc(c)}</button>`).join("") : "";
}

function renderProjects() {
  const items = filtered();
  // featured projects first (only in the "All" view), then the rest in your order
  if (currentFilter === "All") items.sort((a, b) => (b.p.featured ? 1 : 0) - (a.p.featured ? 1 : 0));
  const visible = showAll ? items : items.slice(0, PAGE);
  let wideUsed = false;
  $("#projectGrid").innerHTML = visible.map(({ p, i }) => {
    const wide = p.featured && currentFilter === "All" && !wideUsed; if (wide) wideUsed = true;
    const tags = list(p.tags), first = list(p.impact)[0];
    return `
      <button class="card pcard reveal in ${wide ? "featured" : ""}" data-i="${i}" type="button">
        <div class="pcover">${cover(p, i, wide)}</div>
        <div class="pbody">
          <div class="phead">
            <span class="plogo">${p.logo ? `<img src="${esc(p.logo)}" alt="">` : esc(initialsOf(p.title))}</span>
            <div><h3>${esc(p.title)}</h3><small>${esc(t(p.date) || fmtDate(p.releaseDate) || t(p.category))}</small></div>
          </div>
          <p class="summary">${esc(p.summary)}</p>
          <div class="tags">${tags.slice(0, 3).map(x => `<span class="tag">${esc(x)}</span>`).join("")}${tags.length > 3 ? `<span class="tag">+${tags.length - 3}</span>` : ""}</div>
          <div class="pfoot">
            ${first ? `<span class="metric"><b>${esc(first.value)}</b>${esc(first.label)}</span>` : "<span></span>"}
            ${p.gh && p.gh.release ? `<span class="gh">● ${esc(p.gh.release.tag)}</span>` : `<span class="btn btn-outline btn-sm">${L("details")} ${icon.ext}</span>`}
          </div>
        </div>
      </button>`;
  }).join("");
  $("#moreBtn").hidden = items.length <= PAGE;
  $("#moreBtn").textContent = showAll ? L("fewer") : `${L("more")} (${items.length - PAGE})`;
}

function openProject(i) {
  const p = PROJECTS[i]; if (!p) return;
  const g = p.gh, impact = list(p.impact);
  const meta = [t(p.date) || fmtDate(p.releaseDate), g && g.release ? `${L("release")} ${g.release.tag} · ${fmtDate(g.release.date)}` : "", g && g.stars ? `★ ${g.stars}` : ""].filter(Boolean);
  $("#modal").innerHTML = `
    <div class="mcover">${cover(p, i, false)}<button class="icon-btn mclose" data-close aria-label="Close">${icon.close}</button></div>
    <div class="mbody">
      <div>
        <div class="eyebrow">${esc(p.category)}</div>
        <h3>${esc(p.title)}</h3>
        ${meta.length ? `<div class="mmeta">${meta.map(esc).join(" · ")}</div>` : ""}
      </div>
      <p style="color:var(--muted)">${esc(p.summary)}</p>
      ${impact.length ? `<div class="impact">${impact.map(m => `<div><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join("")}</div>` : ""}
      <div class="case">
        ${t(p.problem) ? `<div><h4>${L("problem")}</h4><p>${esc(p.problem)}</p></div>` : ""}
        ${t(p.approach) ? `<div><h4>${L("approach")}</h4><p>${esc(p.approach)}</p></div>` : ""}
        ${t(p.result) ? `<div><h4>${L("result")}</h4><p>${esc(p.result)}</p></div>` : ""}
      </div>
      <div class="tags">${list(p.tags).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      <div class="mlinks">
        ${p.github ? `<a class="btn btn-primary btn-sm" href="${esc(p.github)}" target="_blank" rel="noopener">${icon.gh} ${L("viewCode")}</a>` : ""}
        ${p.demo ? `<a class="btn btn-outline btn-sm" href="${esc(p.demo)}" target="_blank" rel="noopener">${icon.ext} ${L("liveDemo")}</a>` : ""}
      </div>
    </div>`;
  $("#modal").dataset.i = i;
  if (!$("#modal").open) $("#modal").showModal();
}

function renderExperience() {
  $("#timeline").innerHTML = list(DATA.experience).map(e => {
    const [org, place] = String(t(e.org) || "").split("·").map(s => s.trim());
    const points = list(e.points);
    return `
    <div class="titem reveal in">
      <div class="tlogo">${e.logo ? `<img src="${esc(e.logo)}" alt="">` : esc(initialsOf(org))}</div>
      <div class="card tcard">
        <div class="ttop"><span class="torg">${esc(org)}</span>${t(e.type) ? `<span class="badge">${esc(e.type)}</span>` : ""}</div>
        <h3>${esc(e.role)}</h3>
        <div class="twhen"><span>${icon.cal}${esc(e.when)}</span>${place ? `<span>${icon.pin}${esc(place)}</span>` : ""}</div>
        ${points.length ? `<h5>${L("achievements")}</h5><ul>${points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      </div>
    </div>`; }).join("");
}

function renderSkills() {
  $("#skillGrid").innerHTML = list(DATA.skills).map(s => `
    <div class="card skill reveal in"><h4><i>${esc(s.icon)}</i>${esc(s.name)}</h4><p>${esc(s.note)}</p>
    <div class="chips">${list(s.items).map(x => `<span class="chip"><i></i>${esc(x)}</span>`).join("")}</div></div>`).join("");
  $("#why").innerHTML = list(DATA.why).map(w => `<div class="card reveal in"><h4>${esc(w.title)}</h4><p>${esc(w.text)}</p></div>`).join("");
}

function renderCertificates() {
  const certs = list(DATA.certificates);
  $("#certificates").hidden = !certs.length;
  document.querySelectorAll("[data-certs-link]").forEach(a => a.hidden = !certs.length);
  $("#certGrid").innerHTML = certs.map(c => `
    <div class="card cert reveal in">
      ${c.image ? `<div class="cert-img"><img src="${esc(c.image)}" alt="${esc(c.title)}" loading="lazy"></div>` : ""}
      <div class="cert-body">
        <div class="cert-head">
          <span class="cert-logo">${c.logo ? `<img src="${esc(c.logo)}" alt="">` : icon.award}</span>
          <div><h3>${esc(c.title)}</h3><div class="cert-meta">${esc([t(c.issuer), t(c.date)].filter(Boolean).join(" · "))}</div></div>
        </div>
        ${c.credentialId ? `<div class="cert-id">${L("credential")}: ${esc(c.credentialId)}</div>` : ""}
        ${list(c.skills).length ? `<div class="tags">${list(c.skills).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : ""}
        ${c.url ? `<div class="cert-foot"><a class="btn btn-outline btn-sm" href="${esc(c.url)}" target="_blank" rel="noopener">${L("viewCredential")} ${icon.ext}</a></div>` : ""}
      </div>
    </div>`).join("");
}

function renderArticles() {
  const arts = list(DATA.articles);
  $("#articles").hidden = !arts.length;
  document.querySelectorAll("[data-articles-link]").forEach(a => a.hidden = !arts.length);
  $("#articleGrid").innerHTML = arts.map((a, i) => `
    <a class="card acard reveal in" href="${esc(a.url)}" target="_blank" rel="noopener">
      <div class="pcover">${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : coverArt(["area", "bars", "scatter", "line"][i % 4], i + 40)}</div>
      <div class="pbody"><small>${esc([t(a.date), t(a.source)].filter(Boolean).join(" · "))}</small><h3>${esc(a.title)}</h3>
      ${t(a.summary) ? `<p class="summary">${esc(a.summary)}</p>` : ""}</div>
    </a>`).join("");
}

function renderAll() {
  renderStatic(); renderProfile(); renderFilters(); renderProjects(); renderExperience(); renderCertificates(); renderSkills(); renderArticles();
  if ($("#modal").open) openProject(+$("#modal").dataset.i);
}

// ---------- Interactions ----------
function observe() {   // fade-in for the hero cards on first load
  if (!("IntersectionObserver" in window)) { document.querySelectorAll(".reveal").forEach(el => el.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .06 });
  document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el));
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  renderAll();
}));
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".filter"); if (!b) return;
  currentFilter = b.dataset.c; showAll = false; renderFilters(); renderProjects();
});
$("#moreBtn").addEventListener("click", () => { showAll = !showAll; renderProjects(); });
$("#projectGrid").addEventListener("click", e => { const c = e.target.closest(".pcard"); if (c) openProject(+c.dataset.i); });
$("#modal").addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target === e.currentTarget) e.currentTarget.close(); });
$("#menuBtn").addEventListener("click", () => $("#mobileMenu").classList.toggle("open"));
$("#mobileMenu").addEventListener("click", e => { if (e.target.closest("a")) $("#mobileMenu").classList.remove("open"); });

// highlight the nav link of the section in view
const navObs = "IntersectionObserver" in window && new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  document.querySelectorAll(".nav-links a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
if (navObs) document.querySelectorAll("header[id], section[id]").forEach(s => navObs.observe(s));

(function () {   // dark mode toggle, remembered per visitor
  const root = document.documentElement;
  try { const x = localStorage.getItem("theme"); if (x) root.dataset.theme = x; } catch (e) {}
  $("#themeBtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
})();

// ---------- Boot ----------
$("#yr").textContent = new Date().getFullYear();
PROJECTS = list(DATA.projects);
renderAll(); observe();

const linkedRepos = PROJECTS.map(p => (p.repo || "").trim()).filter(Boolean);
if (DATA.githubUsername || linkedRepos.length) {
  fetchGithub((DATA.githubUsername || "").trim(), linkedRepos).then(gh => {
    PROJECTS = mergeGithub(list(DATA.projects), gh);
    renderFilters(); renderProjects();
  }).catch(err => console.warn("GitHub data unavailable", err));
}
</script>
</body>
</html>
