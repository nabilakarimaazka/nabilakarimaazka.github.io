<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Cover for the A/B test project: conversion rate, ads vs control (numbers from the repo README).
       All content sits between y=70 and y=335 so it survives both the card crop (16:10) and the popup crop (16:7). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="adBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- title -->
  <text x="36" y="90" fill="#ffffff" font-size="22" font-weight="700">Conversion rate by group</text>
  <text x="36" y="112" fill="#bfdbfe" font-size="14">Marketing campaign A/B test · 588,101 users</text>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity=".16" stroke-dasharray="4 6">
    <line x1="36" x2="604" y1="165" y2="165"/>
    <line x1="36" x2="604" y1="215" y2="215"/>
    <line x1="36" x2="604" y1="265" y2="265"/>
  </g>
  <line x1="36" x2="604" y1="308" y2="308" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>

  <!-- bars (baseline y=308; Ads 2.56% = 160px, Control 1.79% = 112px) -->
  <rect x="110" y="196" width="130" height="112" rx="10" fill="#ffffff" fill-opacity=".55"/>
  <rect x="300" y="148" width="130" height="160" rx="10" fill="url(#adBar)"/>

  <!-- values -->
  <text x="175" y="186" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">1.79%</text>
  <text x="365" y="138" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">2.56%</text>

  <!-- labels -->
  <text x="175" y="329" fill="#dbeafe" font-size="14" font-weight="600" text-anchor="middle">Control (PSA)</text>
  <text x="365" y="329" fill="#dbeafe" font-size="14" font-weight="600" text-anchor="middle">Ads</text>

  <!-- lift badge -->
  <g transform="translate(470 126)">
    <rect width="140" height="98" rx="14" fill="#ffffff"/>
    <text x="70" y="38" fill="#1d4ed8" font-size="27" font-weight="800" text-anchor="middle">+0.77 pp</text>
    <text x="70" y="60" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">~43% lift · p &lt; 0.001</text>
    <text x="70" y="80" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">95% CI 0.60–0.94</text>
  </g>
  <path d="M436 190 L466 178" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".8"/>
</svg>
